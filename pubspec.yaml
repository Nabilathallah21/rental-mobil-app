name: zahira_trans
description: "Aplikasi Rental Mobil Zahira Trans"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Package untuk format mata uang (Rupiah) & tanggal Indonesia
  intl: ^0.19.0

  # Package Supabase untuk database & backend
  supabase_flutter: ^2.5.0

  # Untuk PDF dan cetak dokumen
  pdf: ^3.10.4
  printing: ^5.11.1

  # Untuk menyimpan status reset tahunan secara lokal di HP
  shared_preferences: ^2.3.2

  # Package untuk membaca file .env (Sangat penting untuk keamanan API Key)
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Plugin generator ikon aplikasi
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  # Pendaftaran aset gambar & file .env agar terbaca oleh aplikasi
  assets:
    - assets/images/
    - .env

# Konfigurasi pembuatan ikon aplikasi
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21